      - paragraph [ref=e179]: "Disclaimer. OpenNIW is a completely free, open-source (MIT), public-interest self-help tool for organizing your own immigration paperwork. We are not attorneys; OpenNIW is not a law firm; and nothing on this site or in the software is legal advice. It provides no human legal services, no case representation, no individualized assistance from its maintainers, no filing service and no attorney review — the maintainers do not work on individual cases, for anyone, at any price. The software does not determine whether you qualify, does not tell you whether to file, and does not estimate your odds. Using OpenNIW creates no attorney–client relationship. We accept no legal responsibility for the success or failure of any application. You are the petitioner and remain fully responsible for everything you sign and file; immigration outcomes depend on individual facts and adjudicator discretion — consider having a licensed immigration attorney review your case. The software is provided \"AS IS\" without warranty of any kind, and the authors accept no liability arising from its use (MIT license). Your case data is processed only by your own local AI on your own computer — it is never sent to us; we run no server that could receive it. This site is fully static: no accounts, no cookies, no tracking; nothing you type here leaves your browser. Benchmark data is aggregated from publicly posted approval notices (2012–2026), self-reported and successful cases only — it shows distributions of approved profiles, never an individual's approval probability."